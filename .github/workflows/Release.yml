name: Release

# 触发方式：
#   1) 推送 v* 标签（如 v3.5.0-slim）
#   2) 手动触发，填写 release 标签
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release 标签（手动触发时使用，例如 v3.5.0-slim）'
        required: true
        default: 'v3.5.0-slim'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # 注意：根 build.gradle 里 setBuildDir(rootDir/build/...)
  APK_DIR: build/app/outputs/apk/release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # sdkmanager（含 runner 预装版）是 JDK17 编译的，必须用 17 跑；
      # 而本项目的 AGP 7.2.2 + Gradle 7.3.3 需要 11，所以分两步切换 JDK。
      - name: Set up JDK 17 (仅用于 sdkmanager)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Install Android SDK components
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "sdkmanager=$SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-33" "build-tools;33.0.1" "platform-tools"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "--- installed ---"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Set up JDK 11 (Gradle / AGP 7.2.2 要求)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '11'

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::缺少 KEYSTORE_BASE64 secret，无法签名"
            exit 1
          fi
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/smsf-slim.p12
          {
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
            echo "storeFile=../keystore/smsf-slim.p12"
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "storeType=PKCS12"
          } > keystore/keystore.properties
          ls -l keystore/

      # gradle.properties 里是 -Xmx16g，标准 runner 内存不够，按 CI 环境收敛
      - name: Tune Gradle for CI runner
        run: |
          sed -i 's|^org.gradle.jvmargs=.*|org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8|' gradle.properties
          grep -n '^org.gradle.jvmargs=' gradle.properties

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build release (arm64-v8a)
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: List APK
        run: ls -lh "$APK_DIR"

      - name: Resolve release tag
        id: rel
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmsForwarder-arm64-v8a-${{ steps.rel.outputs.tag }}
          path: ${{ env.APK_DIR }}/*.apk
          if-no-files-found: error

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: SmsForwarder 精简版 ${{ steps.rel.outputs.tag }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: ${{ env.APK_DIR }}/*.apk
          body: |
            ## SmsForwarder 精简版 ${{ steps.rel.outputs.tag }}

            基于上游 [pppscn/SmsForwarder](https://github.com/pppscn/SmsForwarder) 的精简分支。

            ### 本包信息
            - **ABI**：仅 `arm64-v8a`（64 位 ARM，现代安卓真机）
            - **构建类型**：Release，已签名

            ### 与上游的差异
            - 发送通道只保留 **邮箱 / Server酱·Turbo / 微信（本地网关）**
            - 移除：自动任务、主动控制（客户端 + 服务端 HTTP API）、内网穿透 FRPC、定位、在线更新、短信指令、Tinker
            - 保留：短信 / 来电 / APP 通知转发、规则、日志、应用列表、Cactus 保活

            ### 安装提示
            - 本包使用**新的签名密钥**，与上游官方包签名不同。若手机上装过官方版，请先卸载再安装。
            - 如果之前装过本项目更早的构建包，签名一致，可直接覆盖安装。
